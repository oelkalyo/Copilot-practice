<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Links</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dbe3f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --btn-bg: #f8fbff;
      --toggle-bg: #e2e8f0;
      --toggle-text: #1f2937;
    }

    :root.dark {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
      --accent: #60a5fa;
      --accent-hover: #93c5fd;
      --btn-bg: #1e293b;
      --toggle-bg: #334155;
      --toggle-text: #f1f5f9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, var(--bg) 100%);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 560px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(37, 99, 235, 0.08);
      overflow: hidden;
    }

    .header {
      background: #0A66C2;
      color: #ffffff;
      padding: 32px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 2.6rem);
      letter-spacing: -0.04em;
      color: #ffffff;
    }

    .header p {
      margin: 0;
      color: #ffffff;
      opacity: 0.9;
      line-height: 1.6;
    }

    .body {
      padding: 32px;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    footer {
      text-align: center;
      padding: 16px 32px 24px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    a.button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 18px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--btn-bg);
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    a.button:hover,
    a.button:focus-visible {
      background: #eff6ff;
      border-color: #bfdbfe;
      color: var(--accent-hover);
      transform: translateY(-1px);
      outline: none;
    }

    .dark a.button:hover,
    .dark a.button:focus-visible {
      background: #1e3a5f;
      border-color: #60a5fa;
    }

    .toggle {
      position: fixed;
      top: 16px;
      right: 16px;
      background: var(--toggle-bg);
      color: var(--toggle-text);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .toggle:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <button class="toggle" onclick="document.documentElement.classList.toggle('dark'); this.textContent = document.documentElement.classList.contains('dark') ? '☀️ Light' : '🌙 Dark'">🌙 Dark</button>
  <main class="card">
    <div class="header">
      <h1>Team Links</h1>
      <p>Quick access to the most important places your team uses every day.</p>
    </div>

    <div class="body">
      <div class="links">
        <a class="button" href="https://team-wiki.notion.site/handbook">Wiki</a>
        <a class="button" href="https://app.datadog.com/dashboard/team-overview">Dashboard</a>
        <a class="button" href="https://example.com/slack">Slack</a>
        <a class="button" href="https://example.com/calendar">Calendar</a>
        <a class="button" href="https://example.com/ask">Ask Me Anything</a>
      </div>
    </div>

    <footer>Last updated: August 20, 2026</footer>
  </main>
</body>
</html>
